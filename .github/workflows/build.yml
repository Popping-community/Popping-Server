name: CI/CD with SonarQube (JDK 21)

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: popping-build-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, Analyze and Deploy (JDK 21)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube 분석을 위한 전체 히스토리 필요

      # JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # SonarQube 분석 캐시
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      # ✅ application.properties 생성 (여기!)
      - name: Set up application.properties
        env:
          APPLICATION_PROPERTIES: ${{ secrets.APPLICATION }}
        run: |
          printf '%s\n' "$APPLICATION_PROPERTIES" > ./src/main/resources/application.properties

      - name: Test deployment guards and image handoff
        run: python3 -B -m unittest discover -s scripts/deployment -p 'test_*.py'

      # SonarQube 분석
      - name: SonarQube Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ./gradlew build sonar \
            -Dsonar.projectVersion=${{ github.run_number }} \
            --info

      # Gradle 설정
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      # Docker Hub 로그인
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Jib로 Docker 이미지 빌드 및 Push
      - name: Build and Push with Jib
        id: image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./gradlew :jib -Djib.to.tags="git-${GITHUB_SHA}"
          image=$(python3 scripts/deployment/jib_image_reference.py build/jib-image.digest)
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$image" > build/release-image.txt

      - name: Preserve exact release image identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ github.sha }}
          path: |
            build/release-image.txt
            build/jib-image.digest
            build/jib-image.id
          if-no-files-found: error

      # SSH를 통한 원격 배포
      - name: Deploy via SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.5
        env:
          POPPING_IMAGE: ${{ steps.image.outputs.image }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.REMOTE_IP }}
          username: ${{ secrets.REMOTE_SSH_ID }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          envs: POPPING_IMAGE,DOCKER_USERNAME,DOCKER_PASSWORD
          script_path: scripts/deployment/deploy_digest.sh
