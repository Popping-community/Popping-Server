global
    log stdout format raw local0 info
    # Runtime API inside the container only, for `show table` (no published port).
    stats socket /tmp/haproxy.sock mode 600 level operator

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend http_front
    bind *:9091

# Write-path rate limits per client address, before the request reaches an app
# (docs/spec/rate-limit-haproxy-20261005.md). Each group has its own table, so
# posting does not use up the login budget. Rejected attempts count too: the limit
# is on how fast an address tries, not on how often it succeeds.
# The baseline load test sends everything from one address and turns this off
# with RATE_LIMIT_OFF (docs/load-test/compose.loadtest.yml); any value turns it off.
.if !defined(RATE_LIMIT_OFF)
    acl is_post   method POST
    acl is_delete method DELETE

    # Match the percent-decoded path: Spring decodes before routing, so /%6cogin reaches
    # the login handler (measured: matched on the raw path, encoded login attempts were
    # never counted). Only the match decodes; the request goes to the app unchanged.
    acl rl_post_path    path,url_dec -m reg ^/boards/[^/]+/(guest|member)/?$
    acl rl_comment_path path,url_dec -m reg ^/boards/[^/]+/[^/]+/comments/(guest|member)/?$
    acl rl_auth_path    path,url_dec -m reg ^/(login|users/join)/?$
    acl rl_auth_path    path,url_dec -m reg ^/boards/[^/]+/[^/]+/(edit-password|delete-password)/?$
    acl rl_guest_delete path,url_dec -m reg ^/boards/[^/]+/[^/]+/comments/[^/]+/guest/?$
    acl rl_image_path   path,url_dec -m reg ^/images/upload/?$
    # A WebSocket upgrade under /ws/ is one new SockJS session, and the guest identity is
    # bound at that handshake - so this caps how fast an address gets new guest identities
    # (docs/spec/ws-connect-limit-20261005.md). WebSocket is the only transport offered.
    acl rl_ws_path      path,url_dec -m reg ^/ws/
    acl is_ws_upgrade   req.hdr(upgrade) -i websocket

    # The groups never overlap, so one tracking counter (sc0) is enough: the first
    # matching rule picks the group's table.
    http-request track-sc0 src table rl_post    if is_post   rl_post_path
    http-request track-sc0 src table rl_comment if is_post   rl_comment_path
    http-request track-sc0 src table rl_auth    if is_post   rl_auth_path
    http-request track-sc0 src table rl_auth    if is_delete rl_guest_delete
    http-request track-sc0 src table rl_image   if is_post   rl_image_path
    http-request track-sc0 src table rl_ws      if is_ws_upgrade rl_ws_path

    http-request set-var(txn.rl_over) bool(true) if is_post   rl_post_path    { sc_http_req_rate(0) gt 5 }
    http-request set-var(txn.rl_over) bool(true) if is_post   rl_comment_path { sc_http_req_rate(0) gt 20 }
    http-request set-var(txn.rl_over) bool(true) if is_post   rl_auth_path    { sc_http_req_rate(0) gt 10 }
    http-request set-var(txn.rl_over) bool(true) if is_delete rl_guest_delete { sc_http_req_rate(0) gt 10 }
    http-request set-var(txn.rl_over) bool(true) if is_post   rl_image_path   { sc_http_req_rate(0) gt 20 }
    http-request set-var(txn.rl_over) bool(true) if is_ws_upgrade rl_ws_path   { sc_http_req_rate(0) gt 30 }

    http-request return status 429 content-type "text/html; charset=utf-8" hdr Retry-After 60 string "<!doctype html><html lang=\"ko\"><meta charset=\"utf-8\"><title>요청이 너무 많습니다</title><body style=\"font-family:sans-serif;text-align:center;padding:4rem 1rem\"><h1>요청이 너무 많습니다</h1><p>잠시 뒤(약 1분) 다시 시도해 주세요.</p><p><a href=\"/\">처음으로</a></p></body></html>" if { var(txn.rl_over) -m bool }
.endif

    default_backend app_servers

backend app_servers
    # No sticky cookie: sessions are in Redis, so any instance can serve any
    # request. Pinning a user to one instance is what made losing that instance
    # log them out, and it also hid the cache and broker state being per-process.
    balance roundrobin
    server app1 popping-app-1:9091 check
    server app2 popping-app-2:9091 check

.if !defined(RATE_LIMIT_OFF)
# One table per group. type ipv6 also holds IPv4 addresses. http_req_rate(1m) is an
# approximate moving rate (current and previous period weighted), not an exact
# 60-second sum. Counters reset when HAProxy restarts.
backend rl_post
    stick-table type ipv6 size 20k expire 10m store http_req_rate(1m)

backend rl_comment
    stick-table type ipv6 size 20k expire 10m store http_req_rate(1m)

backend rl_auth
    stick-table type ipv6 size 20k expire 10m store http_req_rate(1m)

backend rl_image
    stick-table type ipv6 size 20k expire 10m store http_req_rate(1m)

backend rl_ws
    stick-table type ipv6 size 20k expire 10m store http_req_rate(1m)
.endif

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
